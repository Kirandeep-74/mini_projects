<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightgray;
        }

        .box {
            background-color: white;
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
        }

        #count {
            font-size: 50px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: lightblue;
        }
    </style>

</head>

<body>

<div class="box">

    <h2>Counter</h2>

    <h1 id="count">0</h1>

    <button onclick="increment()">Increment</button>
    <button onclick="decrement()">Decrement</button>
    <button onclick="reset()">Reset</button>

</div>

<script>

let count = 0;

function increment() {
    count++;
    document.getElementById("count").innerHTML = count;
}

function decrement() {
    count--;
    document.getElementById("count").innerHTML = count;
}

function reset() {
    count = 0;
    document.getElementById("count").innerHTML = count;
}

</script>

</body>
</html>
